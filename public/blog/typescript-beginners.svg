<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0f2744;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="tsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3178C6"/>
      <stop offset="100%" style="stop-color:#235a97"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid dots -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.2" fill="#334155" opacity="0.6"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Ambient glow top-right -->
  <ellipse cx="980" cy="120" rx="320" ry="200" fill="#3178C6" opacity="0.06"/>
  <!-- Ambient glow bottom-left -->
  <ellipse cx="200" cy="520" rx="280" ry="160" fill="#3178C6" opacity="0.05"/>

  <!-- Top decorative line -->
  <rect x="0" y="0" width="1200" height="3" fill="#3178C6" opacity="0.8"/>

  <!-- Code snippet card - left background decoration -->
  <rect x="680" y="120" width="440" height="400" rx="16" fill="url(#cardGrad)" filter="url(#softShadow)"/>
  <!-- Card top bar -->
  <rect x="680" y="120" width="440" height="40" rx="16" fill="#1a3557"/>
  <rect x="680" y="144" width="440" height="16" fill="#1a3557"/>
  <!-- Traffic lights -->
  <circle cx="712" cy="140" r="7" fill="#ef4444" opacity="0.8"/>
  <circle cx="736" cy="140" r="7" fill="#f59e0b" opacity="0.8"/>
  <circle cx="760" cy="140" r="7" fill="#22c55e" opacity="0.8"/>

  <!-- Code lines in card -->
  <text x="704" y="196" font-family="'Courier New', monospace" font-size="13" fill="#64748b">// TypeScript</text>
  <text x="704" y="224" font-family="'Courier New', monospace" font-size="13">
    <tspan fill="#818cf8">type</tspan>
    <tspan fill="#e2e8f0"> User </tspan>
    <tspan fill="#94a3b8">= </tspan>
    <tspan fill="#cbd5e1">{</tspan>
  </text>
  <text x="724" y="248" font-family="'Courier New', monospace" font-size="13">
    <tspan fill="#7dd3fc">name</tspan>
    <tspan fill="#94a3b8">: </tspan>
    <tspan fill="#86efac">string</tspan>
    <tspan fill="#94a3b8">;</tspan>
  </text>
  <text x="724" y="272" font-family="'Courier New', monospace" font-size="13">
    <tspan fill="#7dd3fc">age</tspan>
    <tspan fill="#94a3b8">: </tspan>
    <tspan fill="#86efac">number</tspan>
    <tspan fill="#94a3b8">;</tspan>
  </text>
  <text x="724" y="296" font-family="'Courier New', monospace" font-size="13">
    <tspan fill="#7dd3fc">role</tspan>
    <tspan fill="#94a3b8">?: </tspan>
    <tspan fill="#86efac">string</tspan>
    <tspan fill="#94a3b8">;</tspan>
  </text>
  <text x="704" y="320" font-family="'Courier New', monospace" font-size="13" fill="#cbd5e1">}</text>

  <text x="704" y="356" font-family="'Courier New', monospace" font-size="13">
    <tspan fill="#818cf8">function</tspan>
    <tspan fill="#67e8f9"> greet</tspan>
    <tspan fill="#94a3b8">(</tspan>
    <tspan fill="#fbbf24">user</tspan>
    <tspan fill="#94a3b8">: </tspan>
    <tspan fill="#86efac">User</tspan>
    <tspan fill="#94a3b8">)</tspan>
    <tspan fill="#94a3b8"> {</tspan>
  </text>
  <text x="724" y="380" font-family="'Courier New', monospace" font-size="13">
    <tspan fill="#818cf8">return</tspan>
    <tspan fill="#fbbf24"> `Hello, </tspan>
    <tspan fill="#94a3b8">${</tspan>
    <tspan fill="#7dd3fc">user</tspan>
    <tspan fill="#94a3b8">.</tspan>
    <tspan fill="#7dd3fc">name</tspan>
    <tspan fill="#94a3b8">}</tspan>
    <tspan fill="#fbbf24">!`</tspan>
  </text>
  <text x="704" y="404" font-family="'Courier New', monospace" font-size="13" fill="#94a3b8">}</text>

  <!-- Cursor blink effect -->
  <rect x="704" y="420" width="9" height="18" fill="#3178C6" opacity="0.9" rx="1"/>

  <!-- TS Badge -->
  <rect x="80" y="80" width="100" height="100" rx="18" fill="url(#tsGrad)" filter="url(#glow)"/>
  <text x="130" y="151" font-family="Arial, sans-serif" font-weight="900" font-size="48" fill="white" text-anchor="middle" letter-spacing="-2">TS</text>

  <!-- Main title -->
  <text x="80" y="248" font-family="Arial, sans-serif" font-weight="800" font-size="58" fill="#f1f5f9" letter-spacing="-1">TypeScript for</text>
  <text x="80" y="318" font-family="Arial, sans-serif" font-weight="800" font-size="58" fill="#3178C6" letter-spacing="-1">Beginners</text>

  <!-- Subtitle -->
  <text x="80" y="376" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8" font-weight="400">From JavaScript to Type-Safe Code</text>

  <!-- Divider line -->
  <rect x="80" y="408" width="480" height="2" fill="#3178C6" opacity="0.4" rx="1"/>

  <!-- Tags row -->
  <rect x="80" y="428" width="130" height="36" rx="18" fill="#1e3a5f"/>
  <text x="145" y="451" font-family="Arial, sans-serif" font-size="14" fill="#7dd3fc" text-anchor="middle" font-weight="600">#typescript</text>

  <rect x="224" y="428" width="120" height="36" rx="18" fill="#1e3a5f"/>
  <text x="284" y="451" font-family="Arial, sans-serif" font-size="14" fill="#7dd3fc" text-anchor="middle" font-weight="600">#javascript</text>

  <rect x="358" y="428" width="110" height="36" rx="18" fill="#1e3a5f"/>
  <text x="413" y="451" font-family="Arial, sans-serif" font-size="14" fill="#7dd3fc" text-anchor="middle" font-weight="600">#frontend</text>

  <!-- Author / date row -->
  <circle cx="92" cy="530" r="20" fill="#3178C6" opacity="0.2"/>
  <text x="92" y="536" font-family="Arial, sans-serif" font-size="16" fill="#3178C6" text-anchor="middle" font-weight="700">A</text>
  <text x="122" y="534" font-family="Arial, sans-serif" font-size="16" fill="#64748b">Rakib Hasan Arif  ·  March 2026</text>

  <!-- Bottom accent line -->
  <rect x="0" y="627" width="1200" height="3" fill="#3178C6" opacity="0.8"/>
</svg>
